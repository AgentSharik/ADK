name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: pyflakes adk tests

      - name: Unit + GUI tests
        run: pytest -v -p no:cacheprovider

      - name: E2E round 1 — user scenario
        run: python tests/e2e_scenario.py | tee e2e1.log; grep -q "46/46" e2e1.log

      - name: E2E round 2 — operations & data
        run: python tests/e2e_round2.py | tee e2e2.log; grep -q "81/81" e2e2.log

      - name: E2E round 3 — printers, search modes, performance
        run: python tests/e2e_round3.py | tee e2e3.log; grep -q "44/44" e2e3.log

      - name: Stability (GUI suite ×5 — catches thread/lifetime crashes)
        run: for i in 1 2 3 4 5; do pytest -q -p no:cacheprovider tests/test_gui.py tests/test_tools.py || exit 1; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-py${{ matrix.python-version }}
          path: |
            e2e1.log
            e2e2.log
