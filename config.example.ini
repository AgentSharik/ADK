; ADK — пример конфигурации.
; Реальный файл: папка ADK рядом с ADK.exe (портативно, с версии 3.9.0); если рядом с exe нет прав
; на запись — %USERPROFILE%\Documents\ADK\config.ini. Создаётся при первом запуске.

[AD]
domain_netbios = EXAMPLE
dc_host = dc01.example.local          ; FQDN конкретного КД (сертификат LDAPS выписан на него)
search_base = DC=example,DC=local
users_ou = OU=Employees,DC=example,DC=local
upn_suffix = example.local
use_ssl = false                        ; LDAPS :636. Без LDAPS пароль задаётся через net user /domain (SAMR)
tls_validate = false                  ; false по умолчанию: у большинства доменов сертификат КД самоподписанный,
                                      ;   и строгая проверка даёт «контроллер домена недоступен»
connect_timeout = 5
; срок действия пароля по доменной политике (для подсказки «истекает через N дн.»); 0 — не считать
max_password_age_days = 90

[Paths]
; база ADK — один файл на отдел: ADK ставится на один ПК, у остальных ярлык. Путь выбирается при первом запуске.
db_path = %USERPROFILE%\Documents\ADK\pc_mapping.db
; true = вопрос «где база?» уже задан (удалите строку, чтобы задать снова)
db_ready = true
; резервная копия базы в папку backups рядом с ней: раз в N часов (0 — не делать), хранить K последних
backup_every_hours = 6
backup_keep = 12
invent_hardware_dir = \\fileserver\invent$\comp\hardware   ; CSV с характеристиками (имя = имя ПК)
pst_backup_base = \\fileserver\pst_backup$                 ; куда Exchange экспортирует PST (пусто = не экспортировать)
rms_viewer_path = C:\Program Files (x86)\Remote Manipulator System - Viewer\rutview.exe
templates_file =                                            ; общий для отдела templates.json (пусто = Documents\ADK\templates.json)

[Scanner]
auto_scan_interval_min = 30
# Серверный режим (adk --serve): раз в сколько минут ПОЛНЫЙ проход — обновляет «кто за ПК» (WMI)
# и журнал КД. Обычные циклы — лёгкие: DNS + пинг 100 мс, без WMI. 0 — полный только при наполнении
# пустой базы. В GUI полный проход — кнопкой «Обновить парк».
auto_scan_deep_every_min = 1440
host_pattern = ^(WS-\d+|PC-.*)$       ; какие имена ПК считать рабочими станциями (действует, только если host_mask пуст)
host_exclude = (VIRT|VM|VBOX|TEST|SRV|SQL|SERVER)
; ГЛАВНЫЙ ФИЛЬТР ПАРКА: маска имён ПК через запятую. ? = одна цифра, * = любые символы.
; Пример: PC-???, LT-* — только эти серии. Если задана — host_pattern выше НЕ действует (не вырезает ваши серии),
; действует только host_exclude. Маска определяет сканирование и через базу — поиск, опись, «ПО парка», принтеры.
; Пусто — как раньше: парк определяет host_pattern.
host_mask =
valid_subnets = 10.,192.168.,172.
dhcp_servers =                        ; 3.2: DHCP-серверы для сверки «Свободного IP» (dhcp01,dhcp02); пусто — без сверки

[Design]
; bg_style / is_dark / accent_color / font_* пишутся диалогом «Дизайн»
follow_system = false                 ; true — тёмная/светлая тема берётся из Windows (AppsUseLightTheme)

[UI]
language = ru                         ; ru | en (применяется сразу)
minimize_to_tray = true               ; показывать значок ADK в трее; закрытие крестиком — всегда полный выход
global_hotkey = Ctrl+Shift+A          ; глобальная клавиша «показать ADK и перейти в поиск»; пусто — выключить
login_method =                        ; запомненный способ входа: sso | password | пусто — спрашивать как обычно

[Access]
; Два независимых права по группам AD администратора (memberOf учётки, под которой выполнен вход):
;   pc_admin_groups — действия с ПК: перезагрузка/выключение, WoL, опрос ПО, заметки, привязка ПК, плагины;
;   ad_admin_groups — изменения объектов AD: атрибуты, включение/отключение УЗ, пароли, смарт-карта,
;                     создание пользователя, группы (в т. ч. массово и «Группы как у…»), шаблоны.
; Пустой список — право есть у всех. Просмотр, пинг, здоровье, экспорт, сравнения доступны всегда.
; Пример: GT_Admins в AD только читает → pc_admin_groups = GT_Admins, IT-Admins ; ad_admin_groups = IT-Admins
readonly = false
readonly_group = ADK-ReadOnly         ; члены этой группы — только чтение (ни ПК, ни AD)
admin_groups =                        ; совместимость: оба права сразу, напр. Domain Admins
pc_admin_groups =                     ; напр. GT_Admins, Helpdesk
ad_admin_groups =                     ; напр. IT-Admins

[Updates]
; Текстовый файл рядом со сборкой на сетевом диске: 1-я строка — версия, 2-я — путь/URL к новой сборке.
version_file = \\fileserver\soft$\ADK\version.txt

[Notify]
; 3.1 — почтовые уведомления о событиях журнала. Пусто — выключено.
smtp_host =                                                 ; mail.example.local
smtp_port = 25
smtp_from = adk@example.local
smtp_to = it-admins@example.local
smtp_user =                                                 ; если сервер требует аутентификацию
smtp_password =
smtp_tls = false                                            ; STARTTLS
actions = reset_password,disable_user,bulk_disable,bulk_reset_password,create_user   ; * — все действия
watch_logins =                                              ; учётки, о которых сообщать всегда: director,cfo

[Attention]
; 3.1 — сводка «Внимание» на дашборде (Ctrl+I)
acct_days = 7                                               ; учётная запись истекает в ближайшие N дней
no_logon_days = 90                                          ; учётка без входа N дней
stale_pc_days = 30                                          ; ПК не был в сети N дней
refresh_min = 30                                            ; период фонового обновления; 0 — только вручную

[Plugins]
dir = %USERPROFILE%\Documents\ADK\plugins   ; *.py с классом Action(adk.plugins.Action) → кнопки в инспекторе
