[AD]
domain_netbios = EXAMPLE
dc_host = dc01.example.local
search_base = DC=example,DC=local
users_ou = OU=Employees,DC=example,DC=local
upn_suffix = example.local
use_ssl = true
tls_validate = true
connect_timeout = 5
max_password_age_days = 90

[Paths]
db_path = /home/user/Documents/ADK/pc_mapping.db
invent_hardware_dir = 
invent_comp_dir = 
invent_compexit_dir = 
pst_backup_base = 
rms_viewer_path = C:\Program Files (x86)\Remote Manipulator System - Viewer\rutview.exe

[Scanner]
auto_scan_interval_min = 30
host_pattern = ^(WS-\d+|PC-.*)$
host_exclude = (VIRT|VM|VBOX|TEST|SRV|SQL|SERVER)
valid_subnets = 10.,192.168.,172.
dhcp_servers = 

[Design]
bg_style = background-color: #161d2e;
is_dark = True
font_family = Sans Serif
font_size = 10
accent_color = #fb923c
follow_system = False

[UI]
language = ru
minimize_to_tray = true
global_hotkey = Ctrl+Shift+A

[Access]
readonly = false
readonly_group = 
admin_groups = 
pc_admin_groups = 
ad_admin_groups = 

[Updates]
version_file = 

[Plugins]
dir = /home/user/Documents/ADK/plugins

[Notify]
smtp_host = 
smtp_port = 25
smtp_from = 
smtp_to = 
smtp_user = 
smtp_password = 
smtp_tls = false
actions = reset_password,disable_user,bulk_disable,bulk_reset_password,create_user
watch_logins = 

[Attention]
acct_days = 7
no_logon_days = 90
stale_pc_days = 30
refresh_min = 30

